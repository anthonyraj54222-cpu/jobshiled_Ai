<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin sign in — JobShield AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f6f4ef;--card:#fffefb;--line:#e6e1d6;--ink:#1d2327;--mute:#6d7176;--accent:#1f3d36;--red:#a23a30}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
    .top{max-width:1080px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;font:600 21px Fraunces,Georgia,serif;color:var(--ink);text-decoration:none}
    .brand svg{width:24px;height:24px}
    main{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:24px}
    .card{width:min(100%,440px);padding:36px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(30,30,20,.07)}
    h1{margin:0;font:500 32px/1.2 Fraunces,Georgia,serif;letter-spacing:-.02em}
    .intro{margin:10px 0 26px;color:var(--mute)}
    label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600}
    input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:14px Inter,sans-serif;color:var(--ink)}
    input:focus{outline:2px solid rgba(31,61,54,.18);border-color:var(--accent)}
    button{width:100%;min-height:46px;margin-top:22px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:white;font:600 14px Inter,sans-serif;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #message{min-height:22px;margin:12px 0 0;color:var(--red);font-size:13px}
    .links{margin:18px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:13px}
    a{color:var(--accent)}
    @media(max-width:480px){.top{padding:18px}.card{padding:26px 22px}}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="JobShield home">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1f3d36" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.1 8.3 7.5 10 4.4-1.7 7.5-5.4 7.5-10v-6L12 2.5Z"/><path d="m8.8 12 2.3 2.3 4.2-4.6" stroke-linecap="round"/></svg>
      JobShield
    </a>
  </header>
  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Admin sign in</h1>
      <p class="intro">Use the administrator credentials configured for this server.</p>
      <form id="adminForm">
        <label for="identifier">Admin username</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" maxlength="254" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required />
        <button type="submit">Admin Login</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <div class="links"><a href="/login.html">Return to user login</a></div>
    </section>
  </main>
  <script>
    const form = document.getElementById("adminForm");
    const message = document.getElementById("message");
    const button = form.querySelector("button");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      if (!form.reportValidity()) return;
      button.disabled = true;
      try {
        const response = await fetch("/api/auth/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            identifier: form.elements.identifier.value,
            password: form.elements.password.value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to sign in.");
        window.location.assign("/");
      } catch (error) {
        message.textContent = error.message || "Unable to reach the server.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
